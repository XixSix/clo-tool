appId: vn.thanhdong.clo-evaluator
productName: CLO_PLO_Evaluator
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/templates/**/*
publish:
  provider: github
  owner: XixSix
  repo: clo-tool
  # 'release' để auto-update thấy bản mới ngay; đổi thành 'draft' nếu muốn duyệt tay
  releaseType: release
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-${version}-portable.${ext}
