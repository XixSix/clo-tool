appId: vn.thanhdong.clo-evaluator
productName: CLO_PLO_Evaluator
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/templates/**/*
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-${version}-portable.${ext}
