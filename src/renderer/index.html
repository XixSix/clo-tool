<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Clove – Đánh giá CLO/PLO</title>
    <script>
      // Áp theme/bảng màu đã lưu trước khi React render để tránh nháy màu.
      try {
        var palette = localStorage.getItem('clo-color-theme')
        if (palette) document.documentElement.dataset.theme = palette
        if (localStorage.getItem('clo-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {}
    </script>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"
    />
  </head>
  <body
    class="bg-background text-foreground selection:bg-primary/20 selection:text-foreground antialiased"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
