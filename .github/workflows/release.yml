name: Release

# Mỗi tag vX.Y.Z là một bản phát hành: build trên Windows + macOS và đính kèm installer.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra tag khớp version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} không khớp version v$version trong package.json"
          }

      - name: Chạy test
        run: npm test

      - name: Build và publish
        run: npm run build; npx electron-builder --win --publish always

  # Job macOS chạy sau job Windows để release đã tồn tại, tránh 2 job tranh nhau tạo.
  # Build cả Apple Silicon (arm64) và Intel (x64) trong một lượt để latest-mac.yml
  # liệt kê đủ cả hai; auto-update trên macOS chỉ hoạt động với target zip.
  release-mac:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra tag khớp version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} không khớp version v$version trong package.json"
            exit 1
          fi

      - name: Chạy test
        run: npm test

      # @napi-rs/canvas là native module: runner arm64 chỉ cài sẵn bản arm64,
      # nên phải cài thêm bản của kiến trúc còn lại để đóng gói đủ cả hai app.
      - name: Cài binary canvas cho cả arm64 và x64
        shell: bash
        run: |
          canvas_version=$(node -p "require('@napi-rs/canvas/package.json').version")
          npm install --no-save \
            "@napi-rs/canvas-darwin-arm64@$canvas_version" \
            "@napi-rs/canvas-darwin-x64@$canvas_version"

      - name: Build và publish (macOS)
        run: npm run build && npx electron-builder --mac --arm64 --x64 --publish always
